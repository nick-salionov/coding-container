services:
  codex-workstation:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        codex-skills: ${CODEX_SKILLS_PATH:-${HOME}/.codex/skills}
    image: codex-workstation:local
    container_name: codex-workstation
    init: true
    working_dir: /workspace
    restart: unless-stopped
    volumes:
      - workspace:/workspace
      - codex-state:/home/codex/.codex
      - gh-state:/home/codex/.config/gh
      - ${HOME}/.codex:/host-config/codex:ro
      - ${HOME}/.config/gh:/host-config/gh:ro

volumes:
  workspace:
  codex-state:
  gh-state:
